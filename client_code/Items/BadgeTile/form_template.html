<div class="st-badge-host">
  <div class="st-badge" anvil:name="tile">
    <span class="em" aria-hidden="true"><anvil-component type="Label" name="emoji" prop:role='["t"]' bind:text="self.item['emoji']"></anvil-component></span>
    <anvil-component type="Label" name="name" prop:role='["st-badge-name"]' bind:text="self.item['name']"></anvil-component>
    <anvil-component type="Label" name="desc" prop:role='["st-badge-desc"]' bind:text="self.item['desc']"></anvil-component>
    <anvil-component type="Label" name="got_sr" prop:role='["sr"]'></anvil-component>
  </div>
</div>
