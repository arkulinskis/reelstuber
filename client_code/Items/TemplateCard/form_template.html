<div class="tp-card-host">
  <div class="tp-card">
    <div class="pv">
      <anvil-component type="Reelstuber.Components.StylePreview" name="preview"></anvil-component>
      <span class="rs-sticker pink" anvil:name="featured">⭐ Featured</span>
    </div>
    <div class="body">
      <anvil-component type="Label" name="title" prop:role='["tp-title"]'></anvil-component>
      <anvil-component type="Label" name="by" prop:role='["tp-by"]'></anvil-component>
      <div class="acts">
        <anvil-component type="Button" name="default_button" prop:text="Make it my default" prop:role='["btn", "btn-sm", "btn-primary", "ic-star"]'></anvil-component>
        <anvil-component type="Button" name="delete_button" prop:text="Delete" prop:role='["btn", "btn-sm", "btn-danger", "btn-icon", "ic-trash"]'></anvil-component>
      </div>
    </div>
  </div>
</div>
