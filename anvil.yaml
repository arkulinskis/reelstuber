metadata:
  description: 'Drop in a long video: Reelstuber finds the best moments, reframes them to 9:16, adds word-by-word captions
    and exports MP4 reels. Nothing is uploaded.'
  logo_img: asset:icon-512.png
  title: 'Reelstuber: turn long videos into reels in your browser'
name: Reelstuber
native_deps:
  head_html: "<script src=\"_/theme/legal-kit.js?v=7f2fa0c0fb\"></script>\n<!-- seo:start (APP_MAKER/seo: edit seo/apps/reelstuber.json\
    \ and run seo.py, not here) -->\n<meta name=\"robots\" content=\"index, follow, max-image-preview:large, max-snippet:-1,\
    \ max-video-preview:-1\">\n<meta name=\"keywords\" content=\"long video to shorts, video to reels, YouTube Shorts maker,\
    \ TikTok clip maker, auto captions, podcast clips, 9:16 reframe, clip finder, browser video editor\">\n<meta name=\"author\"\
    \ content=\"Arkvital\">\n<meta property=\"og:type\" content=\"website\">\n<meta property=\"og:site_name\" content=\"Reelstuber\"\
    >\n<meta property=\"og:title\" content=\"Reelstuber: turn long videos into reels in your browser\">\n<meta property=\"\
    og:description\" content=\"Drop in a long video: Reelstuber finds the best moments, reframes them to 9:16, adds word-by-word\
    \ captions and exports MP4 reels. Nothing is uploaded.\">\n<meta property=\"og:locale\" content=\"en_CA\">\n<meta name=\"\
    twitter:card\" content=\"summary\">\n<meta name=\"twitter:title\" content=\"Reelstuber: turn long videos into reels in\
    \ your browser\">\n<meta name=\"twitter:description\" content=\"Drop in a long video: Reelstuber finds the best moments,\
    \ reframes them to 9:16, adds word-by-word captions and exports MP4 reels. Nothing is uploaded.\">\n<!-- seo:end -->\n\
    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<meta name=\"theme-color\"\
    \ content=\"#FFF7EC\">\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<link rel=\"preconnect\" href=\"\
    https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"\
    https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:opsz,wght@9..40,400..700&family=Anton&family=Bangers&family=Luckiest+Guy&family=Bungee&family=Titan+One&family=Lilita+One&family=Permanent+Marker&family=Pacifico&family=Rubik+Mono+One&display=swap\"\
    \ rel=\"stylesheet\">\n<link id=\"ui-favicon\" rel=\"icon\" type=\"image/svg+xml\" href=\"_/theme/icon.svg?v=40d604cc54\"\
    >\n<link rel=\"apple-touch-icon\" href=\"_/theme/icon-180.png?v=40d604cc54\">\n<script>\n/* Keep our tab icon: Anvil adds\
    \ its own <link rel=\"icon\">, so drop any other icon link. */\n(function () {\n  function keep() {\n    var ours = document.getElementById('ui-favicon');\n\
    \    if (!ours) return;\n    document.querySelectorAll('link[rel~=\"icon\"]').forEach(function (l) { if (l !== ours) l.remove();\
    \ });\n  }\n  keep();\n  document.addEventListener('DOMContentLoaded', keep);\n  window.addEventListener('load', keep);\n\
    })();\n</script>\n\n<!-- Prepsto feedback panel: every \"Submit feedback\" link and button opens it (it is the only feedback\
    \ channel). No floating button, no cookies, nothing loads until it is opened. Codes: APP_MAKER/prepsto-links.json -->\n\
    <script src=\"https://prepsto.com/_/theme/widget.js\" data-prepsto=\"m9ke3hk\" data-button=\"false\" data-label=\"Submit\
    \ feedback\" async></script>\n<link rel=\"stylesheet\" href=\"_/theme/app.css?v=afb58ae3b9\">\n<script src=\"_/theme/app.js?v=86c8227f1f\"\
    ></script>\n"
package_name: Reelstuber
runtime_options:
  client_version: '3'
  server_spec:
    base: python314
  version: 3
services:
- client_config:
    enable_v2: true
  server_config: {}
  source: /runtime/services/tables.yml
- client_config:
    allow_remember_me: true
    allow_signup: true
    confirm_email: false
    enable_automatically: true
    remember_me_days: 30
    require_secure_passwords: true
    use_email: true
  server_config:
    user_table: users
  source: /runtime/services/anvil/users.yml
startup:
  module: Main
  type: form
